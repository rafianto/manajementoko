<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TokoPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0B0E14', surface: '#121620', card: '#181D2A',
                        border: '#252D3D', accent: '#00E5A0', danger: '#FF4D6A',
                        muted: '#6B7A99', fg: '#E2E8F0', fgDim: '#94A3B8',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-bg flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-accent/20 flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-store text-accent text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-fg" style="font-family:'Space Grotesk'">TokoPro</h1>
            <p class="text-muted mt-1">Sistem Manajemen Toko</p>
        </div>

        <!-- Form -->
        <div class="bg-card border border-border rounded-xl p-8">
            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                <div class="bg-danger/10 border border-danger/30 text-danger rounded-lg p-3 mb-4 text-sm">
                    Username atau password salah.
                </div>
                {% endif %}

                <div class="mb-4">
                    <label class="block text-sm font-medium text-fgDim mb-1.5">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-muted text-sm"></i>
                        <input type="text" name="username" required
                               class="w-full bg-surface border border-border rounded-lg py-2.5 pl-10 pr-4 text-fg text-sm focus:outline-none focus:border-accent"
                               placeholder="Masukkan username">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-fgDim mb-1.5">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-muted text-sm"></i>
                        <input type="password" name="password" required
                               class="w-full bg-surface border border-border rounded-lg py-2.5 pl-10 pr-4 text-fg text-sm focus:outline-none focus:border-accent"
                               placeholder="Masukkan password">
                    </div>
                </div>

                <button type="submit" class="w-full bg-accent text-bg font-semibold py-2.5 rounded-lg hover:bg-accent/90 transition-colors">
                    <i class="fas fa-right-to-bracket mr-2"></i>Masuk
                </button>
            </form>
        </div>

        <p class="text-center text-muted text-xs mt-6">TokoPro v1.0 &mdash; Sistem Manajemen Toko</p>
    </div>
</body>
</html>
